<!DOCTYPE html>
<html>
<head>
    <title>Employee registration form</title>
</head>
<body>
    <form>
    <h1>Registration form</h1>
 
    <label for="name">Name:</label>
    <input type="text"
    placeholder="Enter your name"
      id="name"
      name="name"
    >
 
    <br><br>

    <label for="age">Age:  </label>
    <input type="number"
    id="age"
    name="age"
    placeholder="Enter your age">

    <br><br>
 
    <label for="email">Email:</label>
    <input type="email"
    id="email"
    name="name"
    >
    <br><br>
    <label for="password">Password:</label>
    <input type="password"
    id="password"
    name="password">
    <br><br>
   <label for="address">Address</label>
<textarea
id="message"
rows="5"
cols="30"
></textarea>
<br><br>
<p>Gender</p>
<label>
    <input
    type="radio"
    name="gender"
    value="male">
    Male
</label>
 <label>
    <input
    type="radio"
    name="gender"
    value="female">
    Female
 </label>
 <label>
    <input
    type="radio"
    name="gender"
    value="other">
    Other
 </label>
 <br><br>
 <p>Hobbies</p>
<label>
    <input
    type="checkbox"
    name="hobbies"
    value="cricket">
    cricket
<label>
    <input
    type="checkbox"
    name="hobbies"
    type="football">
    football
<label>
    <input
    type="checkbox"
    name="hobbies"
    value="basketball">
    basketball
<label>
    <input
    type="checkbox"
    name="hobbies"
    value="running">
    Running
</label>
</label>
</label>
</label>
<br><br>

<label for="course">Course</label>
 
<select id="course">
 
    <option value="python fullstack">Python fullstack</option>
    <option value="data science">Data science</option>
    <option value="software testing">Software testing</option>
    <option value="mernstack">Mernstack</option>
</select>

<br><br>

    <button type="submit">Submit</button>
 
</form>
</body>
</html>
